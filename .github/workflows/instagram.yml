name: Instagram gönderilerini güncelle

on:
  schedule:
    - cron: "17 5 * * *"   # her gün 08:17 (Türkiye)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/instagram_feed.py
      - name: Değişiklik varsa kaydet
        run: |
          git add assets/instagram
          if git diff --cached --quiet; then echo "Yeni gönderi yok."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instagram gönderileri güncellendi"
          git push
